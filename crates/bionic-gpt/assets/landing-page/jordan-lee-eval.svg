<svg xmlns="http://www.w3.org/2000/svg" width="749" height="665" viewBox="0 0 749 665" role="img" aria-labelledby="title desc">
  <title id="title">Email to Salesforce contact update</title>
  <desc id="desc">A transparent chat vignette showing Gmail and Salesforce tool calls followed by a concise confirmation.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#222222" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; }
      .body { fill:#3e495d; font-size:16px; }
      .tool { fill:#59575d; font-size:16px; font-weight:700; }
      .detail { fill:#89878d; font-size:16px; }
    </style>
  </defs>

  <!-- User message -->
  <g filter="url(#soft-shadow)">
    <rect x="150" y="34" width="449" height="105" rx="14" fill="#ffffff"/>
  </g>
  <text x="174" y="68" fill="#171717" font-size="15.5px">
    <tspan x="174">Jordan Lee just emailed us with a new phone number.</tspan>
    <tspan x="174" dy="25">Can you find that email and update her phone number</tspan>
    <tspan x="174" dy="25">in Salesforce?</tspan>
  </text>

  <line x1="374.5" y1="139" x2="374.5" y2="174" stroke="#555555" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- One assistant response -->
  <g filter="url(#soft-shadow)">
    <rect x="48" y="174" width="654" height="447" rx="16" fill="#ffffff"/>
  </g>
  <rect x="48" y="174" width="654" height="447" rx="16" fill="#ffffff" filter="url(#paper-grain)"/>

  <g transform="translate(81 214)">
    <text x="0" y="18" font-size="18" fill="#252525">I’ll find Jordan’s email and update the matching contact.</text>

    <!-- Tool calls, one line each -->
    <line x1="14" y1="66" x2="14" y2="240" stroke="#e2e3e6" stroke-width="2"/>

    <circle cx="14" cy="66" r="11" fill="#f1f2f4"/>
    <text x="14" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#55575d">G</text>
    <text x="40" y="72"><tspan class="tool">Gmail</tspan><tspan dx="10" fill="#d1d1d5">•</tspan><tspan dx="10" class="detail">Searched for Jordan Lee</tspan></text>

    <circle cx="14" cy="124" r="11" fill="#f1f2f4"/>
    <text x="14" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#55575d">G</text>
    <text x="40" y="130"><tspan class="tool">Gmail</tspan><tspan dx="10" fill="#d1d1d5">•</tspan><tspan dx="10" class="detail">Read “Updated phone number”</tspan></text>

    <text x="14" y="180" text-anchor="middle" font-size="20" fill="#b8b8bd">⋮</text>

    <circle cx="14" cy="240" r="11" fill="#eaf7f1"/>
    <text x="14" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#16825e">S</text>
    <text x="40" y="246"><tspan class="tool">Salesforce</tspan><tspan dx="10" fill="#d1d1d5">•</tspan><tspan dx="10" class="detail">Jordan Lee’s contact updated</tspan></text>

    <line x1="0" y1="284" x2="587" y2="284" stroke="#ececef"/>

    <!-- Final assistant summary -->
    <text x="0" y="323" font-size="19" fill="#374256" font-weight="700">Salesforce updated with Jordan Lee’s</text>
    <text x="0" y="351" font-size="19" fill="#374256" font-weight="700">new number: +1-555-0101.</text>
    <text x="0" y="382" class="body">The previous number was +1-555-0000.</text>
  </g>
</svg>
