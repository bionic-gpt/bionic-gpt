<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs>
  <style>
    .bg{fill:#192a31}.panel{fill:#1d3038;stroke-width:2}.dash{stroke-dasharray:10 8}
    .blue{stroke:#55b8ff}.green{stroke:#42c76b}.purple{stroke:#a78bfa}.orange{stroke:#ffad21}.grey{stroke:#91a3ab}
    .t{font-family:Inter,Arial,sans-serif;fill:#edf5f7}.h{font-size:26px;font-weight:700}.s{font-size:19px;font-weight:600}.b{font-size:16px}.small{font-size:14px;fill:#c6d2d7}
    .line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.box{rx:14}
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#91a3ab"/></marker>
  <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#55b8ff"/></marker>
</defs>
<rect width="1800" height="980" class="bg"/>

<!-- User -->
<rect x="35" y="100" width="245" height="740" rx="24" class="panel green"/>
<text x="158" y="140" text-anchor="middle" class="t h">User</text>
<rect x="70" y="185" width="175" height="115" class="panel green box"/>
<text x="158" y="235" text-anchor="middle" class="t s">Chat UI</text>
<text x="158" y="265" text-anchor="middle" class="small">intent + files</text>
<rect x="70" y="340" width="175" height="115" class="panel green box"/>
<text x="158" y="390" text-anchor="middle" class="t s">Approvals</text>
<text x="158" y="420" text-anchor="middle" class="small">user consent</text>

<!-- Bionic boundary -->
<rect x="320" y="35" width="1120" height="900" rx="28" fill="none" class="blue dash" stroke-width="2"/>
<text x="880" y="70" text-anchor="middle" class="t h" fill="#55b8ff">Bionic GPT</text>

<!-- Harness -->
<rect x="370" y="100" width="1010" height="105" class="panel green box"/>
<text x="875" y="140" text-anchor="middle" class="t h">Agent Harness</text>
<text x="875" y="175" text-anchor="middle" class="small">model loop · context · run_bash</text>

<!-- Runtime -->
<rect x="370" y="245" width="500" height="590" rx="22" fill="none" class="green dash" stroke-width="2"/>
<text x="620" y="282" text-anchor="middle" class="t h">Runtime / Sandbox</text>
<rect x="410" y="315" width="420" height="95" class="panel green box"/>
<text x="620" y="355" text-anchor="middle" class="t s">run_bash</text>
<text x="620" y="382" text-anchor="middle" class="small">shell · Python · Unix-style tools</text>

<rect x="410" y="445" width="420" height="325" class="panel green box"/>
<text x="620" y="480" text-anchor="middle" class="t s">Virtual Filesystem</text>
<text x="445" y="520" class="t b">/memory.md</text>
<text x="445" y="555" class="t b">/attachments</text>
<text x="445" y="590" class="t b">/conversations</text>
<text x="445" y="625" class="t b">/datasets</text>
<text x="445" y="660" class="t b">/skills</text>
<text x="445" y="695" class="t b">/artifacts</text>
<text x="445" y="730" class="t b">/tmp</text>

<!-- Host services -->
<rect x="915" y="245" width="425" height="590" rx="22" fill="none" class="purple dash" stroke-width="2"/>
<text x="1128" y="282" text-anchor="middle" class="t h">Bionic Host Services</text>

<rect x="955" y="315" width="345" height="155" class="panel purple box"/>
<text x="1128" y="350" text-anchor="middle" class="t s">VFS Provider</text>
<text x="1128" y="382" text-anchor="middle" class="small">lazy fetch · permissions</text>
<text x="1128" y="407" text-anchor="middle" class="small">persistence · logical paths</text>
<text x="1128" y="432" text-anchor="middle" class="small">object store · database · skills</text>

<rect x="955" y="510" width="345" height="205" class="panel purple box"/>
<text x="1128" y="545" text-anchor="middle" class="t s">Network Gateway</text>
<text x="1128" y="580" text-anchor="middle" class="small">destination policy</text>
<text x="1128" y="607" text-anchor="middle" class="small">credential injection</text>
<text x="1128" y="634" text-anchor="middle" class="small">audit + rate limits</text>
<text x="1128" y="661" text-anchor="middle" class="small">OpenAPI / MCP bridges</text>

<rect x="955" y="750" width="345" height="60" class="panel purple box"/>
<text x="1128" y="787" text-anchor="middle" class="t s">Credential Store</text>

<!-- External -->
<rect x="1490" y="90" width="270" height="750" rx="24" fill="none" class="orange dash" stroke-width="2"/>
<text x="1625" y="130" text-anchor="middle" class="t h">External Services</text>
<rect x="1525" y="185" width="200" height="105" class="panel orange box"/>
<text x="1625" y="230" text-anchor="middle" class="t s">Model Inference</text>
<text x="1625" y="260" text-anchor="middle" class="small">LLM providers</text>
<rect x="1525" y="365" width="200" height="220" class="panel orange box"/>
<text x="1625" y="405" text-anchor="middle" class="t s">Enterprise APIs</text>
<text x="1625" y="445" text-anchor="middle" class="small">CRM</text>
<text x="1625" y="475" text-anchor="middle" class="small">Email</text>
<text x="1625" y="505" text-anchor="middle" class="small">ERP</text>
<text x="1625" y="535" text-anchor="middle" class="small">Databases</text>
<rect x="1525" y="650" width="200" height="105" class="panel orange box"/>
<text x="1625" y="695" text-anchor="middle" class="t s">Storage</text>
<text x="1625" y="725" text-anchor="middle" class="small">S3 / object storage</text>

<!-- arrows -->
<path d="M245 242 C300 242 310 152 370 152" class="line grey" marker-end="url(#arrow)"/>
<path d="M875 205 L875 220 C875 230 620 225 620 315" class="line grey" marker-end="url(#arrow)"/>
<path d="M830 600 C885 600 900 392 955 392" class="line blue" marker-end="url(#arrowBlue)"/>
<text x="885" y="455" class="small">file operations</text>
<path d="M830 365 C900 365 900 610 955 610" class="line blue" marker-end="url(#arrowBlue)"/>
<text x="850" y="565" class="small">HTTP</text>
<path d="M1300 610 C1400 610 1410 475 1525 475" class="line grey" marker-end="url(#arrow)"/>
<path d="M1300 780 C1365 780 1370 650 1525 702" class="line grey" marker-end="url(#arrow)"/>
<path d="M1128 750 L1128 715" class="line grey" marker-end="url(#arrow)"/>
<path d="M1380 150 C1440 150 1450 238 1525 238" class="line grey" marker-end="url(#arrow)"/>

<!-- footer -->
<text x="875" y="900" text-anchor="middle" class="small">Ephemeral execution · capabilities mediated by filesystem and network boundaries</text>
</svg>