          type: object
          additionalProperties:
            type: object
            properties:
              filterable:
                description: >-
                  Whether the field is filterable. If true, the field is indexed and can be used in filters. Only true
                  values are allowed.
                type: boolean
      required:
        - fields
    ModelIndexEmbed:
