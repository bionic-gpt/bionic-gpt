[package]
name = "tool-runtime"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
rag-engine = { path = "../rag-engine" }
rig = { package = "rig-core", version = "0.40", default-features = false, features = ["reqwest", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tiktoken-rs = "0.9.1"
tracing.workspace = true
axum.workspace = true
chrono.workspace = true
db = { path = "../db" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
async-trait.workspace = true
oas3.workspace = true
oauth2.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls", "stream"] }
time = { workspace = true, features = ["parsing", "formatting"] }
monty = { git = "https://github.com/pydantic/monty.git", rev = "23b5ffedfa219b1cb56823555442b6489c4b3481", package = "monty" }
monty-types = { git = "https://github.com/pydantic/monty.git", rev = "23b5ffedfa219b1cb56823555442b6489c4b3481", package = "monty-types" }
# Used by tests
futures.workspace = true

# Used by the web tool to stream responses
futures-util = "0.3"
html2text = "0.16"
bashkit = "0.14.3"
md5 = "0.7.0"
mime_guess = "2.0.5"
object-storage = { path = "../object-storage" }
