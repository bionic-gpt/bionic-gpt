[package]
name = "tool-runtime"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
base64.workspace = true
rig = { package = "rig-core", version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tiktoken-rs = "0.9.1"
tracing.workspace = true
axum.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
cron = "0.15"
db = { path = "../db" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
async-trait.workspace = true
oas3.workspace = true
oauth2.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls", "stream"] }
time = { workspace = true, features = ["parsing", "formatting"] }
# Used by tests
futures.workspace = true

# Used by the web tool to stream responses
futures-util = "0.3"
html2text = "0.16"
bashkit = { version = "0.14.5", features = ["python", "sqlite"] }
md5 = "0.7.0"
mime_guess = "2.0.5"
object-storage = { path = "../object-storage" }
