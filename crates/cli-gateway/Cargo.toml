[package]
name = "cli-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true }
futures-util = "0.3"
http.workspace = true
mime_guess = "2.0"
multer = "3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["multipart"] }
tower = { workspace = true, features = ["util"] }
