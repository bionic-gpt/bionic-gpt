[package]
edition = "2024"
name = "rig-core"
version = "0.42.0"
build = false
exclude = [
    "tests/macro_hygiene.rs",
    "tests/fixtures/telemetry_macro_consumer",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An opinionated library for building LLM powered applications."
readme = "README.md"
license = "MIT"
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
audio = []
default = [
    "reqwest",
    "derive",
    "rustls",
]
derive = ["dep:rig-derive"]
epub = [
    "dep:epub",
    "dep:quick-xml",
]
image = []
native-tls = [
    "reqwest/native-tls",
    "tokio-tungstenite?/native-tls",
]
pdf = ["dep:lopdf"]
rayon = ["dep:rayon"]
reqwest = [
    "reqwest/charset",
    "reqwest/http2",
    "reqwest/system-proxy",
]
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-native-tls = [
    "dep:reqwest-middleware",
    "native-tls",
]
reqwest-middleware-rustls = [
    "dep:reqwest-middleware",
    "rustls",
    "reqwest-middleware/rustls",
]
rustls = [
    "reqwest/rustls",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
]
socks = ["reqwest/socks"]
test-utils = []
websocket = ["websocket-rustls"]
websocket-native-tls = [
    "dep:tokio-tungstenite",
    "tokio-tungstenite/connect",
    "native-tls",
]
websocket-rustls = [
    "dep:tokio-tungstenite",
    "tokio-tungstenite/connect",
    "rustls",
]

[lib]
name = "rig_core"
path = "src/lib.rs"
doctest = true

[[example]]
name = "cohere_image_embeddings"
path = "examples/cohere_image_embeddings.rs"

[[test]]
name = "driver_adoption"
