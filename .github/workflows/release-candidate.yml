name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to release from'
        required: false
        default: main

permissions:
  contents: write
  packages: write

concurrency:
  group: release-candidate-${{ github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      DAGGER_LOG_FORMAT: plain
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
      version: ${{ steps.release_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install release tooling
        run: |
          npm i -D @semantic-release/commit-analyzer
          npm i -D @semantic-release/release-notes-generator
          npm i -D @semantic-release/exec
          npm i -D @semantic-release/git

      - name: Determine next version
        id: next_version
        run: |
          VERSION=$(npx semantic-release@20 --dry-run --no-ci --plugins @semantic-release/commit-analyzer --plugins @semantic-release/release-notes-generator 2>&1 \
            | grep -Eo 'The next release version is [0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{print $6}' \
            | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "Unable to determine next version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Determined next version: $VERSION"

      - name: Run release pipeline
        env:
          RELEASE_VERSION: ${{ steps.next_version.outputs.version }}
        run: cargo run -p dagger-pipeline --release -- all

      - name: Publish quality summary
        if: always()
        run: |
          if [ -f SUMMARY.md ]; then
            cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quality summary not available (SUMMARY.md missing)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure git author
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"

      - name: Prepare release tag
        id: release_tag
        run: |
          git fetch --tags origin
          base_version="${{ steps.next_version.outputs.version }}"
          legacy_tag="v${base_version}-rc"
          base_pattern=$(printf '%s' "$base_version" | sed 's/\./\\\\./g')
          next_rc=1

          # Number repeated candidates for the same base version. Treat the
          # legacy unnumbered tag as candidate 1 for compatibility.
          while IFS= read -r existing_tag; do
            if [ "$existing_tag" = "$legacy_tag" ]; then
              candidate=1
            elif [[ "$existing_tag" =~ ^v${base_pattern}-rc\.([0-9]+)$ ]]; then
              candidate="${BASH_REMATCH[1]}"
            else
              continue
            fi

            if (( candidate >= next_rc )); then
              next_rc=$((candidate + 1))
            fi
          done < <(git tag -l "v${base_version}-rc*")

          tag="v${base_version}-rc.${next_rc}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$base_version" >> "$GITHUB_OUTPUT"
          echo "Prepared release candidate tag: $tag"

      - name: Create RC tag
        id: create_tag
        run: |
          rc_tag="${{ steps.release_tag.outputs.tag }}"
          base_version="${{ steps.release_tag.outputs.version }}"
          next_rc="${rc_tag##*.}"

          while true; do
            rc_tag="v${base_version}-rc.${next_rc}"

            if git rev-parse --verify --quiet "refs/tags/${rc_tag}" >/dev/null; then
              next_rc=$((next_rc + 1))
              continue
            fi

            git tag -a "$rc_tag" -m "Release candidate $rc_tag"
            if git push origin "refs/tags/${rc_tag}"; then
              echo "tag=$rc_tag" >> "$GITHUB_OUTPUT"
              break
            fi

            git tag -d "$rc_tag"
            if git ls-remote --exit-code --tags origin "refs/tags/${rc_tag}" >/dev/null 2>&1; then
              next_rc=$((next_rc + 1))
              continue
            fi

            echo "Failed to push release candidate tag ${rc_tag}" >&2
            exit 1
          done

      - name: Create GitHub Release (RC)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
