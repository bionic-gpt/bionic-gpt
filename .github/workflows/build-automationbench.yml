name: Build AutomationBench API adapter

on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_COLOR: 1
      DAGGER_LOG_FORMAT: plain
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish AutomationBench server with Dagger
        run: |
          cargo run -p dagger-pipeline --release -- \
            automationbench \
            --publish \
