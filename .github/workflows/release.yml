name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      DAGGER_LOG_FORMAT: plain
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find latest RC tag
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          latest_rc=$(git tag -l "v*-rc*" --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc(\.[0-9]+)?$' \
            | head -n1)
          if [ -z "${latest_rc}" ]; then
            echo "No RC tags found"
            exit 1
          fi
          echo "latest_rc=${latest_rc}" >> "$GITHUB_OUTPUT"
          base="${latest_rc%%-rc*}"
          echo "base=${base#v}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${latest_rc} -> ${base}"

      - name: Create stable tag (same commit as RC)
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          rc_tag="${{ steps.rc.outputs.latest_rc }}"
          stable="v${{ steps.rc.outputs.base }}"
          commit=$(git rev-list -n 1 "${rc_tag}")
          git tag -a "${stable}" -m "Promote ${rc_tag} to ${stable}" "${commit}"
          git push origin "${stable}"

      - name: Update versioned assets
        env:
          RELEASE_VERSION: ${{ steps.rc.outputs.base }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Release version must be X.Y.Z")

          repositories = (
              "bionicgpt", "bionicgpt-postgres-mcp", "bionicgpt-cli-gateway",
              "bionicgpt-rabbitmq", "bionicgpt-rag-engine", "bionicgpt-db-migrations",
              "bionicgpt-eval-mocks", "bionicgpt-cron", "integration-simulator",
          )
          # Match complete image references, never service keys or partial names.
          image = re.compile(
              r"^(?P<prefix>[ \t]*image:[ \t]*)(?P<quote>['\"]?)"
              r"(?P<repository>"
              + "|".join(re.escape("ghcr.io/bionic-gpt/" + name) for name in repositories)
              + r"):[A-Za-z0-9_][A-Za-z0-9_.-]*"
              r"(?P=quote)(?P<suffix>[ \t]*(?:[ \t]#[^\r\n]*)?\r?)$",
              re.MULTILINE,
          )
          for name in ("docker-compose.yml", "stack.yaml", "stack-selenium.yaml"):
              path = Path("infra-as-code") / name
              content = path.read_bytes().decode("utf-8")
              updated = image.sub(
                  lambda m: m['prefix'] + m['quote'] + m['repository'] + ':'
                  + version + m['quote'] + m['suffix'],
                  content,
              )
              if updated != content:
                  path.write_bytes(updated.encode("utf-8"))
          PY

      - name: Configure git author
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git add infra-as-code/docker-compose.yml \
                  infra-as-code/stack.yaml \
                  infra-as-code/stack-selenium.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(deployment): Update release metadata for ${{ steps.rc.outputs.base }} [ci skip]"
          git push

      - name: Create GitHub Release (stable)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.rc.outputs.base }}
          prerelease: false
          generate_release_notes: true
