name: Build Office tools adapter

on:
  workflow_dispatch:
    inputs:
      archipelago_ref:
        description: Archipelago git ref
        required: false
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_COLOR: 1
      DAGGER_LOG_FORMAT: plain
    steps:
      - uses: actions/checkout@v6
      - name: Build and publish Office tools with Dagger
        run: |
          cargo run -p dagger-pipeline --release -- \
            office-tools \
            --archipelago-ref '${{ inputs.archipelago_ref || 'main' }}' \
            --publish
      - name: Upload generated OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: office-tools-openapi
          path: office-tools-openapi
